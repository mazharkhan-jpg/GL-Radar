# GL Radar — runtime settings

poll:
  # How often each collector family runs, in minutes.
  # Instagram is the expensive one; don't set it below 30.
  news_minutes: 30
  website_minutes: 120
  instagram_minutes: 60
  linkedin_minutes: 360
  events_minutes: 720
  supervisor_minutes: 60
  # The dashboard checks with the server every minute and triggers a cycle when
  # this many minutes have passed, however many tabs are open.
  auto_refresh_minutes: 60
  auto_refresh_default: true
  # A guaranteed full sweep once a day, in the timezone set under `notify`
  # below, so the board is never more than 24 hours behind even if every other
  # trigger was missed. 7 means the queue is ready before you start work.
  daily_sweep_hour: 7

freshness:
  # The recency contract. Enforced at ingest, classification, display,
  # notification and ticket creation, and independently audited by the
  # supervisor after every cycle.
  #
  # The review queue shows this many days back...
  lookback_days: 7
  # ...and this many days forward for scheduled events.
  lookahead_days: 7
  # Once something falls out of the window above it moves to the Archive tab
  # and stays browsable for this long. Nothing is deleted before then.
  archive_days: 90
  # Which day marks fire a countdown. Values above lookahead_days are dropped.
  reminder_marks: [7, 2, 1]
  # Pending items that age out of the window are marked expired rather than
  # left sitting in the queue looking actionable.
  auto_expire: true

scoring:
  # Classifier importance is 0-100. Below `min_importance` the item is stored
  # but never surfaces. At or above `auto_ticket_at` it skips the review queue
  # and goes straight to ClickUp.
  min_importance: 45
  notify_at: 60
  auto_ticket_at: 85
  # Priority-1 companies get a bump so nothing from Gross Labs itself is missed.
  # 1 = direct investment or wholly owned, 2 = active involvement,
  # 3 = ecosystem or indirect. Tier 3 used to mean "unverified", which is why
  # it was penalised heavily; it now means a real but looser relationship, so
  # the penalty is lighter.
  priority_boost:
    1: 15
    2: 0
    3: -5

classifier:
  # auto   use Claude when ANTHROPIC_API_KEY is set, free keyword rules when not
  # rules  always free keyword rules, no API key needed, noisier
  # claude always Claude, fails loudly if the key is missing
  mode: auto
  model: claude-sonnet-4-6
  max_tokens: 1200
  # Items from an owned account (our own IG handles) skip classification
  # for relevance but still get a caption suggestion.
  trust_owned_accounts: true

collectors:
  google_news: true
  rss: true
  website_diff: true
  # On: posts are read through Apify (see the `apify` block below). Needs
  # APIFY_TOKEN set as a repository secret and nothing else — no Meta app,
  # no Facebook Page, no expiring token.
  instagram: true
  # Off until the Instagram spend has been measured for a few days and we
  # know how much of the free monthly credit is left. The collector and the
  # budget ledger are ready; this is the only switch.
  linkedin: false
  # Jina Reader: renders JavaScript-heavy pages and reads public LinkedIn
  # company pages. No key, no login, no account to get banned. Runs anywhere.
  jina: true
  events: true         # requires Ticketmaster API key
  youtube: false

apify:
  # Instagram and LinkedIn are read through Apify's pay-per-result scrapers.
  # Billing is per post returned, so the two numbers that control cost are
  # `posts_per_handle` and how many handles exist in companies.yaml.
  #
  #   29 handles x 3 posts over a 2-day window = well under 90/day
  #
  # Apify's free plan grants $5 of credit a month, so that sits at under
  # half. The budget below is the hard stop: once the month's tally crosses
  # it the collector stops calling Apify and logs why, rather than spending
  # quietly. The tally lives in the `cursors` table and resets each month.
  # The job runs daily and the database remembers every post it has already
  # seen, so there is no reason to ask for a week of history every morning —
  # it bills for posts we already have and then discards them as duplicates.
  # Two days covers a missed run without paying for the same posts twice.
  lookback_days: 2
  monthly_budget_usd: 4.0
  usd_per_1000_results: 0.50
  posts_per_handle: 3
  posts_per_company: 5
  instagram_actor: "apidojo~instagram-scraper"
  linkedin_actor: "apimaestro~linkedin-company-posts"

clickup:
  # Where repost tickets land. Run `python -m radar.cli lists` to print every
  # list in your workspace with its id, then paste the one you want here.
  list_id: "${CLICKUP_LIST_ID}"
  # Optional per-company routing. Anything not listed uses list_id above.
  #   list_overrides:
  #     breakaway: "901111111"    # events team
  #     beeup: "902222222"        # brand team
  list_overrides: {}
  task_name_prefix: "[Repost] "
  default_tags: ["gl-radar", "repost"]
  # Optional: map a custom field on your ClickUp list to the source URL.
  # Find IDs via GET /api/v2/list/{list_id}/field
  custom_fields:
    source_url: ""
    company: ""
    importance: ""

notify:
  desktop: true
  slack_webhook: "${SLACK_WEBHOOK_URL}"
  # Quiet hours in your local timezone. Notifications queue instead of firing.
  timezone: "Asia/Kolkata"
  quiet_start: 23
  quiet_end: 8

feed:
  # How the To Review list is balanced when showing every company at once.
  # Picking a company in the rail shows all of its items regardless.
  max_per_company: 3
  # Events get a share of the week, not the whole of it.
  max_events: 4

export:
  # After you push to GitHub, put "yourname/gl-radar" here. The Refresh button
  # on the published page then links straight to the workflow's Run button,
  # which is the only refresh a static page can honestly offer.
  github_repo: "mazharkhan-jpg/GL-Radar"

server:
  host: "127.0.0.1"
  port: 8787
