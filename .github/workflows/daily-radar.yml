# GL Radar daily job
#
# Collects, scores, and writes data.json — the file the Claude artifact reads.
# Netlify is no longer involved; the artifact hosts itself.
#
# The SQLite file and data.json are committed back after each run. That is how
# deduplication survives between runs, since GitHub wipes the runner each time.
name: GL Radar daily

on:
  schedule:
    # 01:30 UTC is 07:00 Asia/Kolkata, so the board is ready before work.
    - cron: "30 1 * * *"
  workflow_dispatch:        # the Run workflow button

concurrency:
  # Two runs writing the database at once would corrupt the dedup history.
  group: gl-radar
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the database and data.json back

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: gl-radar

    env:
      # Optional. Without it, scoring falls back to free keyword rules.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
      CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_TOKEN_ISSUED: ${{ secrets.IG_TOKEN_ISSUED }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      # Optional. Raises the free translation allowance from ~5k to ~50k chars/day.
      MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gl-radar/requirements.txt

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Report what can and cannot be watched
        continue-on-error: true
        run: python -m radar.cli doctor

      - name: Collect, score and ticket
        run: python -m radar.cli poll --group all

      - name: Audit the recency contract
        # Flags problems in the log without blocking publication. A board that
        # reports its own faults beats no board.
        continue-on-error: true
        run: python -m radar.cli supervise

      - name: Write the artifact's data file
        run: python scripts/export_json.py

      - name: Save the database and data file
        # Dedup history lives in radar.db. Without this commit every run would
        # rediscover the same stories and re-ticket them.
        run: |
          git config user.name  "gl-radar"
          git config user.email "gl-radar@users.noreply.github.com"
          git add -f data/radar.db data.json
          git diff --quiet --cached || git commit -m "radar: $(date -u +%Y-%m-%d)"
          git push
